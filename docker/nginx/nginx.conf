upstream frontend_up {
    server frontend:3000;
}

upstream backend_up {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API
    location /api/ {
        proxy_pass http://backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://backend_up/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_up/openapi.json;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend_up/healthz;
        proxy_set_header Host $host;
    }

    location = /api/meta {
        proxy_pass http://backend_up/api/meta;
        proxy_set_header Host $host;
    }

    # Frontend (Next.js standalone)
    location /_next/static/ {
        proxy_pass http://frontend_up;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
